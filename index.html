<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Faso High Tech — Produits</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
body{background:#f1f5f9;color:#333;padding:24px}
.wrap{max-width:1200px;margin:0 auto}
h1{color:#0047AB;margin-bottom:4px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.sub{color:#6C757D;font-size:.9rem}
.btn{display:inline-block;padding:10px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;transition:.2s}
.btn--primary{background:#0047AB;color:#fff}.btn--primary:hover{background:#003788}
.btn--ghost{background:#fff;color:#0047AB;border:1px solid #0047AB}
.btn--danger{background:#dc3545;color:#fff}
.btn--sm{padding:6px 12px;font-size:.8rem}
table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06);border-collapse:collapse}
thead{background:#0047AB;color:#fff}
th,td{padding:12px 14px;text-align:left;font-size:.9rem;border-bottom:1px solid #eee;vertical-align:middle}
th{font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
img.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #eee}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:.7rem;font-weight:700;color:#fff}
.badge.hot{background:#dc3545}.badge.new{background:#28a745}.badge.promo{background:#ffc107;color:#333}
.badge.inactive{background:#6C757D}
.row-actions{display:flex;gap:6px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h2{margin-bottom:16px;color:#0047AB;font-size:1.2rem}
.field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;font-weight:600;color:#333}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:.9rem}
.field textarea{min-height:80px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{padding:40px;text-align:center;color:#6C757D}
@media (max-width:640px){
  th,td{padding:10px 8px;font-size:.82rem}
  img.thumb{width:40px;height:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Produits · Faso High Tech</h1>
      <div class="sub">Gestion dynamique (table <code>fht_products</code>)</div>
    </div>
    <div>
      <button class="btn btn--primary" id="addBtn">+ Nouveau produit</button>
      <button class="btn btn--ghost" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Image</th><th>Nom</th><th>Prix</th><th>Badge</th><th>Ordre</th><th>Actif</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" class="empty">Chargement…</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Nouveau produit</h2>
    <form id="productForm">
      <input type="hidden" id="pId">
      <div class="field"><label>Nom *</label><input id="pName" required></div>
      <div class="field"><label>Description</label><textarea id="pDesc"></textarea></div>
      <div class="field"><label>Prix (FCFA) *</label><input id="pPrice" type="number" min="0" step="1" required></div>
      <div class="field"><label>Image URL</label><input id="pImg" placeholder="image/HP4.jpg ou https://…"></div>
      <div class="field"><label>Type de badge</label>
        <select id="pBadge">
          <option value="">Aucun</option>
          <option value="hot">🔥 Best Seller (hot)</option>
          <option value="new">Nouveau (new)</option>
          <option value="promo">Promo (promo)</option>
        </select>
      </div>
      <div class="field"><label>Texte du badge</label><input id="pBadgeLabel" placeholder="🔥 Best Seller"></div>
      <div class="field"><label>Message WhatsApp</label><input id="pWa" placeholder="Bonjour, je suis intéressé(e) par…"></div>
      <div class="field"><label>Ordre d'affichage</label><input id="pOrder" type="number" value="0" step="1"></div>
      <div class="field" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="pActive" checked style="width:auto">
        <label for="pActive" style="margin:0">Actif (visible sur le site)</label>
      </div>
      <div class="actions">
        <button type="button" class="btn btn--ghost" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn--primary" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ----- AUTH -----
if (sessionStorage.getItem("fht_admin") !== "true"){
  window.location.href = "index.html";
}

const SUPABASE_URL = "https://otdiywrvzappbmjfkkyi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZGl5d3J2emFwcGJtamZra3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTQyMDcsImV4cCI6MjA4NTE5MDIwN30.O5gHqJF1SCvpu19Z0OFHhQsT_ZmeIFbuEu-bpBZXXtY";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = n => new Intl.NumberFormat("fr-FR").format(n) + " FCFA";

let PRODUCTS = [];

async function load(){
  const { data, error } = await db.from("fht_products").select("*").order("sort_order");
  if (error){ alert("Erreur : " + error.message); return; }
  PRODUCTS = data || [];
  render();
}

function render(){
  const tbody = $("#tbody");
  if (!PRODUCTS.length){
    tbody.innerHTML = `<tr><td colspan="7" class="empty">Aucun produit. Clique sur "Nouveau produit".</td></tr>`;
    return;
  }
  tbody.innerHTML = PRODUCTS.map(p => `
    <tr>
      <td><img class="thumb" src="${esc(p.image_url || "")}" alt=""></td>
      <td><strong>${esc(p.name)}</strong></td>
      <td>${fmt(p.price)}</td>
      <td>${p.badge_type ? `<span class="badge ${esc(p.badge_type)}">${esc(p.badge_label||p.badge_type)}</span>` : "—"}</td>
      <td>${p.sort_order ?? 0}</td>
      <td>${p.active ? "✅" : `<span class="badge inactive">inactif</span>`}</td>
      <td>
        <div class="row-actions">
          <button class="btn btn--ghost btn--sm" data-edit="${p.id}">✏️</button>
          <button class="btn btn--danger btn--sm" data-del="${p.id}">🗑️</button>
        </div>
      </td>
    </tr>`).join("");
}

function openModal(product = null){
  $("#modalTitle").textContent = product ? "Modifier le produit" : "Nouveau produit";
  $("#pId").value       = product?.id ?? "";
  $("#pName").value     = product?.name ?? "";
  $("#pDesc").value     = product?.description ?? "";
  $("#pPrice").value    = product?.price ?? 0;
  $("#pImg").value      = product?.image_url ?? "";
  $("#pBadge").value    = product?.badge_type ?? "";
  $("#pBadgeLabel").value = product?.badge_label ?? "";
  $("#pWa").value       = product?.whatsapp_message ?? "";
  $("#pOrder").value    = product?.sort_order ?? 0;
  $("#pActive").checked = product?.active ?? true;
  $("#modalBg").classList.add("open");
}
function closeModal(){ $("#modalBg").classList.remove("open"); $("#productForm").reset(); }

$("#addBtn").onclick = () => openModal();
$("#cancelBtn").onclick = closeModal;
$("#modalBg").addEventListener("click", e => { if (e.target === $("#modalBg")) closeModal(); });

$("#productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = $("#pId").value;
  const payload = {
    name: $("#pName").value.trim(),
    description: $("#pDesc").value.trim() || null,
    price: Number($("#pPrice").value || 0),
    image_url: $("#pImg").value.trim() || null,
    badge_type: $("#pBadge").value || null,
    badge_label: $("#pBadgeLabel").value.trim() || null,
    whatsapp_message: $("#pWa").value.trim() || null,
    sort_order: Number($("#pOrder").value || 0),
    active: $("#pActive").checked
  };
  const btn = $("#saveBtn");
  btn.disabled = true; btn.textContent = "Enregistrement…";

  let res;
  if (id) res = await db.from("fht_products").update(payload).eq("id", id);
  else    res = await db.from("fht_products").insert(payload);

  btn.disabled = false; btn.textContent = "Enregistrer";

  if (res.error){ alert("Erreur : " + res.error.message); return; }
  closeModal();
  await load();
});

document.addEventListener("click", async (e) => {
  const editId = e.target.closest("[data-edit]")?.dataset.edit;
  const delId  = e.target.closest("[data-del]")?.dataset.del;
  if (editId){
    const p = PRODUCTS.find(x => String(x.id) === String(editId));
    if (p) openModal(p);
  }
  if (delId){
    if (!confirm("Supprimer ce produit ?")) return;
    const { error } = await db.from("fht_products").delete().eq("id", delId);
    if (error) alert("Erreur : " + error.message);
    else await load();
  }
});

$("#logoutBtn").onclick = () => {
  sessionStorage.removeItem("fht_admin");
  window.location.href = "index.html";
};

load();
</script>
</body>
</html>
